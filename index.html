<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hui+ 收银台 v5｜精简交互原型</title>
<style>
:root{--blue:#2165ef;--pale:#eaf1ff;--line:#e4e8ef;--ink:#1d2634;--muted:#667085;--bg:#f6f8fc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.topbar{height:3px;background:#1e66ee}.review{max-width:1180px;margin:18px auto 0;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.review h1{font-size:18px;margin:0}.review p{font-size:12px;color:var(--muted);margin:5px 0}.switch{display:flex;background:#e7ecf4;border-radius:9px;padding:3px}.switch button{border:0;background:transparent;padding:8px 15px;border-radius:7px;color:#556070}.switch .on{background:#fff;color:#1454cc;box-shadow:0 1px 4px #cbd5e2}
.layout{max-width:1180px;margin:18px auto 42px;padding:0 20px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}.summary,.checkout{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #273e6310}.summary{padding:25px;position:sticky;top:20px}.summary small,.eyebrow{font-size:12px;color:var(--muted)}.summary h2{font-size:20px;margin:10px 0 23px}.sumrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f5;font-size:13px}.sumrow:last-of-type{border:0}.total{display:flex;justify-content:space-between;align-items:end;margin-top:25px;font-weight:700}.total strong{font-size:22px;color:var(--blue)}.checkout{padding:28px}.express{font-size:13px;color:#838b9a;text-align:center}.gpay{display:block;width:100%;height:45px;border:0;border-radius:24px;margin:12px 0 19px;background:#080808;color:white;font-size:16px;font-weight:600}.divider{display:flex;gap:16px;align-items:center;color:#8991a1;font-size:13px;margin-bottom:18px}.divider:before,.divider:after{content:"";height:1px;background:#d9e1ee;flex:1}.section-title{font-size:15px;font-weight:700;margin:18px 0 10px}.method{width:100%;min-height:61px;display:flex;align-items:center;text-align:left;gap:13px;padding:12px 15px;background:#fff;border:1px solid var(--line);margin-top:-1px;color:var(--ink)}.method:first-child{border-radius:12px 12px 0 0;margin-top:0}.method:last-child{border-radius:0 0 12px 12px}.method:hover{background:#f8faff}.method.selected{position:relative;z-index:1;background:var(--pale);border-color:#a8c2fa}.radio{height:18px;width:18px;border:1.5px solid #bfc9d7;border-radius:50%;display:grid;place-items:center;flex:none}.selected .radio{border:5px solid var(--blue)}.method-name{font-weight:600;font-size:14px}.method-sub{display:block;margin-top:3px;font-size:11px;color:var(--muted)}.logo{margin-left:auto;color:#65758b;background:#f1f5fb;border-radius:6px;padding:4px 6px;font-size:10px;white-space:nowrap}.selected .logo{background:white}.apm-head{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.apm-head h3{font-size:15px;margin:0}.count{font-size:12px;color:var(--muted)}.hint{font-size:12px;line-height:1.5;color:#647087;margin:8px 0 14px}.apm-group{margin-bottom:8px}.expand{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;color:#1e5ad0;padding:13px;margin-top:12px;font-weight:700}.expand:hover{background:#f5f8ff}.chosen{font-size:12px;color:#4b5d74;margin:15px 0 8px}.action-area{position:sticky;bottom:0;background:linear-gradient(180deg,#ffffffd9,#fff 22%);padding-top:12px;z-index:5}.pay{border:0;color:#fff;background:var(--blue);font-weight:700;width:100%;min-height:51px;border-radius:30px;font-size:16px}.pay:disabled{background:#9cb5e5;cursor:not-allowed}.fineprint{text-align:center;margin-top:15px;font-size:12px;color:#9098a4}.fineprint span{margin:0 10px}.reco-note{background:#f7faff;border:1px solid #dce8ff;border-radius:10px;padding:10px 12px;color:#405b7c;font-size:12px;margin-top:16px;line-height:1.5}
.mobile .layout{display:block;max-width:430px;margin-top:14px;padding:0 10px}.mobile .summary{position:static;padding:15px;margin-bottom:10px}.mobile .summary h2{font-size:16px;margin:5px 0 8px}.mobile .sumrow{display:none}.mobile .total{margin-top:4px;font-size:13px}.mobile .total strong{font-size:18px}.mobile .checkout{padding:18px 14px;border-radius:12px}.mobile .method{min-height:55px}.mobile .action-area{bottom:0;margin:0 -14px -18px;padding:10px 14px 16px;border-top:1px solid #e8edf5}.mobile .fineprint{font-size:10px}.mobile .review{max-width:430px}.mobile .review h1{font-size:15px}.mobile .review p{font-size:11px}
.card-form{border:1px solid #a8c2fa;border-top:0;border-radius:0 0 12px 12px;background:#fafcff;padding:18px;margin-bottom:10px}.card-form-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.card-form-head strong{font-size:13px}.jump-apm{border:0;background:transparent;color:#1659d6;font-weight:700;font-size:12px;padding:5px 0;text-align:right}.card-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card-field{display:block;font-size:12px;color:#5b6676}.card-field.wide{grid-column:1/-1}.card-field input{display:block;width:100%;height:42px;margin-top:5px;border:1px solid #d6dfed;border-radius:9px;background:#fff;padding:0 12px;color:#263242}.card-field input::placeholder{color:#a1a9b6}.card-note{font-size:11px;color:#7b8493;line-height:1.5;margin:12px 0 0}.card-open{border-radius:12px 12px 0 0!important}.mobile .card-form{padding:14px}.mobile .card-fields{gap:10px}.mobile .card-form-head{align-items:flex-start}.mobile .card-form-head strong{line-height:1.5}.mobile .jump-apm{max-width:135px;line-height:1.4}.mobile .action-area{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);margin:0;padding:10px 14px 12px;box-shadow:0 -6px 20px #29436812}.mobile{padding-bottom:105px}#pcApmList{margin-top:12px;scroll-margin-top:18px}
.overlay{position:fixed;inset:0;background:#10182890;z-index:30;display:none;align-items:center;justify-content:center;padding:16px}.overlay.open{display:flex}.dialog{background:#fff;width:min(530px,100%);max-height:min(92vh,850px);overflow:auto;border-radius:16px;padding:22px;box-shadow:0 20px 60px #0003}.dialog h2{font-size:18px;margin:2px 0 8px}.dialog p{font-size:13px;color:#586477;line-height:1.6}.dialog .row{display:flex;justify-content:space-between;gap:10px;align-items:center}.icon-btn{border:0;background:#eef2f8;border-radius:50%;width:30px;height:30px;font-size:19px}.dialog .box{border:1px solid #d9e4f5;background:#f6f9ff;padding:14px;border-radius:10px;margin:14px 0;line-height:1.7;font-size:13px}.dialog .secondary{border:1px solid #cbd7ed;color:#2057b1;background:white;border-radius:22px;padding:10px 15px;margin:5px 6px 0 0}.dialog .primary{border:0;color:white;background:var(--blue);border-radius:22px;padding:11px 18px;margin:5px 6px 0 0}.dialog input{border:1px solid #bdcce0;border-radius:8px;padding:11px;width:100%;margin:6px 0}.status{font-weight:700;color:#1764d8}.small{font-size:11px!important;color:#738096!important}
.sheet{display:none;position:fixed;inset:0;z-index:20;background:white;flex-direction:column}.sheet.open{display:flex}.sheet-head{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.sheet-head strong{font-size:17px}.sheet-body{padding:14px 16px 25px;overflow:auto;flex:1}.sheet .method{min-height:58px}.sheet-foot{border-top:1px solid var(--line);padding:10px 16px;color:#667085;font-size:12px;background:#fff}
.apm-input{border:1px solid #a8c2fa;border-top:0;background:#fafcff;padding:16px;border-radius:0 0 12px 12px;margin-bottom:10px}.apm-input label{font-size:13px;font-weight:700;display:block}.apm-input input{display:block;margin-top:8px;width:100%;max-width:360px;border:1px solid #cbd5e4;border-radius:9px;padding:11px 12px;background:#fff}.apm-input p{font-size:12px;color:#53627a;line-height:1.6;margin:9px 0 0}.apm-input .error{color:#b42318;min-height:18px}.apm-input + .method{margin-top:0}.demo-controls{font-size:11px;color:#78859a;margin-top:18px;border-top:1px solid #e9edf4;padding-top:10px}.demo-controls summary{cursor:pointer}.demo-controls button{margin:8px 6px 0 0;border:1px solid #d6dfec;background:#fff;border-radius:6px;padding:5px 9px;color:#526078}.qr-demo{width:155px;height:155px;border:2px dashed #b5c9ed;display:grid;place-items:center;text-align:center;margin:auto;background:#fff;color:#566b90;font-size:12px;padding:15px}.field-line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #e4eaf4}.field-line:last-child{border:0}.field-line button{border:0;background:transparent;color:#1454cc;font-weight:700}.flow-note{font-size:12px!important;color:#596a84!important}
@media(max-width:780px){.layout{grid-template-columns:1fr}.summary{position:static}.summary .sumrow{display:none}.summary h2{margin-bottom:10px}.summary .total{margin-top:8px}.checkout{padding:20px}.review{margin-top:12px}}
</style>
</head>
<body>
<div class="topbar"></div>
<div id="app">
  <header class="review"><div><h1>Hui+ v5 支付方式列表｜精简评审原型</h1><p>跨市场演示全部 20 个候选和示例金额；真实订单仅展示可用方式。MB WAY 展示 App 推送分支，BLIK 展示代码分支；跳转分支复用外跳流程。</p></div><div class="switch" role="group" aria-label="终端切换"><button id="pcTab" class="on" type="button">PC 端</button><button id="h5Tab" type="button">H5 端</button></div></header>
  <main class="layout">
    <aside class="summary"><small>ORDER SUMMARY / 订单信息</small><h2>测试订单</h2><div class="sumrow"><span>订单号</span><span>DEMO-V5-2026</span></div><div class="sumrow"><span>商品金额</span><span>HKD 10.00</span></div><div class="sumrow"><span>优惠</span><span>HKD 0.00</span></div><div class="total"><span>应付金额</span><strong>HKD 10.00</strong></div></aside>
    <section class="checkout" aria-label="Hui+ 收银台">
      <div class="express">Express Checkout</div><button class="gpay" type="button" data-existing="Google Pay">Google Pay · 支付 HKD 10.00</button><div class="divider">or</div>
      <div class="section-title">常用支付方式</div><div id="existingList"></div>
      <div id="pcApmList"></div>
      <button id="expandButton" class="expand" type="button" aria-expanded="false">查看全部支付方式 ↓</button>
      <div class="action-area"><button id="payButton" class="pay" type="button">支付 HKD 10.00</button><div class="fineprint">Powered by Huifu Payment Limited <span>PCI DSS</span> Privacy Policy</div></div>
    </section>
  </main>
</div>
<div id="selector" class="sheet" role="dialog" aria-modal="true" aria-label="选择支付方式"><div class="sheet-head"><strong>选择支付方式</strong><button id="closeSelector" class="icon-btn" type="button" aria-label="关闭">×</button></div><div class="sheet-body"><div id="sheetList"></div></div><div class="sheet-foot">选定方式后返回收银台继续付款。</div></div>
<div id="flowOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="支付流程演示"><div class="dialog"><div class="row"><h2 id="flowTitle"></h2><button id="closeFlow" class="icon-btn" type="button" aria-label="关闭">×</button></div><p id="flowIntro"></p><div id="flowBody"></div><div id="flowActions"></div></div></div>
<script>
const apms=[
 {id:'wechat-hk',name:'微信香港版',region:'香港',flow:'wallet',sub:'钱包 · PC 扫码 / H5 唤起'},
 {id:'wechat-intl',name:'微信国际版',region:'香港',flow:'wallet',sub:'钱包 · 入口是否独立待确认'},
 {id:'alipay-hk',name:'AlipayHK',region:'香港',flow:'wallet',sub:'钱包 · 与大陆版支付宝区分'},
 {id:'mbway',name:'MB WAY',region:'欧洲',flow:'mbway',sub:'手机号 + App 推送确认（待联调）'},
 {id:'multibanco',name:'Multibanco',region:'欧洲',flow:'reference',sub:'实体号 / 参考号 · 异步付款'},
 {id:'blik',name:'BLIK',region:'欧洲',flow:'blik',sub:'一次性代码或渠道跳转（待联调）'},
 {id:'bancontact',name:'Bancontact',region:'欧洲',flow:'redirect',sub:'银行网页或 App / 扫码（待联调）'},
 {id:'p24',name:'Przelewy24',region:'欧洲',flow:'redirect',sub:'银行 / 服务商页面'},
 {id:'payu',name:'PayU',region:'欧洲',flow:'redirect',sub:'服务商页面'},
 {id:'satispay',name:'Satispay',region:'欧洲',flow:'wallet',sub:'App 确认 / 扫码（待联调）'},
 {id:'paybybank',name:'Pay by Bank app',region:'欧洲',flow:'redirect',sub:'银行网页 / App 授权'},
 {id:'clearpay',name:'Clearpay',region:'欧洲',flow:'bnpl',sub:'先买后付 · 服务商页面'},
 {id:'trustly',name:'Trustly',region:'欧洲',flow:'redirect',sub:'银行网页授权'},
 {id:'paysafe',name:'paysafecard',region:'欧洲',flow:'paysafe',sub:'凭证 / 账户页，产品形态待确认'},
 {id:'klarna',name:'Klarna',region:'欧洲',flow:'bnpl',sub:'先买后付 · 服务商页面'},
 {id:'eps',name:'EPS',region:'欧洲',flow:'redirect',sub:'网银跳转 · 需专项稳定性复测'},
 {id:'sepa',name:'SEPA 银行转账',region:'欧洲',flow:'sepa',sub:'收款信息 · 异步到账；不含扣款授权'},
 {id:'afterpay',name:'AfterPay',region:'美国',flow:'bnpl',sub:'先买后付 · 服务商页面'},
 {id:'zip',name:'zip',region:'美国',flow:'bnpl',sub:'先买后付 · 服务商页面'},
 {id:'cashapp',name:'Cash App Pay',region:'美国',flow:'wallet',sub:'扫码 / App 确认，按 Stripe 返回'}
];
const existing=[{id:'card',name:'信用卡／借记卡',sub:'Visa · Mastercard · 银联等'},{id:'applepay',name:'Apple Pay',sub:'现有支付能力'},{id:'googlepay',name:'Google Pay',sub:'现有支付能力'},{id:'octopus',name:'八达通 Octopus',sub:'现有支付方式'},{id:'wechat-cn',name:'微信支付（大陆版）',sub:'现有支付方式'},{id:'alipay-cn',name:'支付宝（大陆版）',sub:'现有支付方式'}];
const state={device:'pc',expanded:false,selected:'card',phone:'',blikCode:'',externalMethod:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=id=>[...existing,...apms].find(m=>m.id===id)?.name||id;
function ctaText(){const method=apms.find(m=>m.id===state.selected);if(method?.flow==='reference'||method?.flow==='sepa')return '查看付款状态';if(method?.flow==='blik')return '提交 BLIK 代码';return '支付 HKD 10.00'}
function row(m){let selected=state.selected===m.id;let detail=m.region?'':`<span class="method-sub">${esc(m.sub)}</span>`;let trailing=m.region?'<span class="logo" aria-hidden="true">›</span>':'';return `<button class="method ${selected?'selected':''} ${m.id==='card'&&selected?'card-open':''}" type="button" data-method="${m.id}" aria-pressed="${selected}"><span class="radio" aria-hidden="true"></span><span><span class="method-name">${esc(m.name)}</span>${detail}</span>${trailing}</button>`}
function cardForm(){return `<div class="card-form" id="cardForm"><div class="card-form-head"><strong>信用卡／借记卡信息</strong><button class="jump-apm" id="jumpApm" type="button">使用其他支付方式 ↓</button></div><div class="card-fields"><label class="card-field wide">卡号<input autocomplete="off" inputmode="numeric" placeholder="输入卡号"></label><label class="card-field">有效期<input autocomplete="off" placeholder="MM / YY"></label><label class="card-field">安全码<input autocomplete="off" inputmode="numeric" placeholder="CVV / CVC"></label><label class="card-field">持卡人名<input autocomplete="off" placeholder="First name"></label><label class="card-field">持卡人姓<input autocomplete="off" placeholder="Last name"></label></div><p class="card-note">演示页面，请勿输入真实卡号。</p></div>`}
function inputForm(m){if(state.selected!==m.id)return '';if(m.flow==='mbway')return `<div class="apm-input"><label for="mbwayPhone">MB WAY 注册手机号<input id="mbwayPhone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(state.phone)}" placeholder="例如 +351 9XX XXX XXX"></label><p>付款请求将发送到这个手机号绑定的 MB WAY App。提交后请在 App 中确认。</p><p class="error" id="mbwayError" role="alert"></p></div>`;if(m.flow==='blik')return `<div class="apm-input"><label for="blikInput">6 位 BLIK 代码<input id="blikInput" inputmode="numeric" maxlength="6" autocomplete="one-time-code" value="${esc(state.blikCode)}" placeholder="在银行 App 中查看代码"></label><p>提交代码后，还需要在银行 App 中确认付款。</p><p class="error" id="blikError" role="alert"></p></div>`;return ''}
function group(items,inline=true){return `<div class="apm-group">${items.map(m=>row(m)+(inline?inputForm(m):'')).join('')}</div>`}
function render(){document.querySelector('body').classList.toggle('mobile',state.device==='h5');$('pcTab').classList.toggle('on',state.device==='pc');$('h5Tab').classList.toggle('on',state.device==='h5');$('existingList').innerHTML=existing.map(m=>row(m)+(m.id==='card'&&state.selected==='card'?cardForm():'')).join('');const featured=apms.slice(0,6);const selected=apms.find(m=>m.id===state.selected);const visible=selected&&!featured.includes(selected)?[selected,...featured.slice(0,5)]:featured;
 $('pcApmList').innerHTML=state.expanded?group(apms):group(visible);
 $('expandButton').textContent=state.device==='h5'?'查看全部支付方式 →':state.expanded?'收起支付方式 ↑':'查看全部支付方式 ↓';$('expandButton').setAttribute('aria-expanded',String(state.expanded));$('payButton').textContent=ctaText();
 if(state.device==='h5'){$('pcApmList').innerHTML=group(visible);state.expanded=false}
 $('sheetList').innerHTML=group(apms,false);
}
function openSelector(){$('selector').classList.add('open');document.body.style.overflow='hidden';render();$('closeSelector').focus()}
function closeSelector(){$('selector').classList.remove('open');document.body.style.overflow='';render()}
function select(id){const m=apms.find(x=>x.id===id);if(state.selected===id&&!$('selector').classList.contains('open')){if(m&&['reference','sepa'].includes(m.flow))pay(true);return}state.selected=id;if($('selector').classList.contains('open'))closeSelector();else render();requestAnimationFrame(()=>{const target=id==='card'?document.querySelector('[data-method="card"]'):document.querySelector('#pcApmList [data-method="'+id+'"]');(target||$('pcApmList')).scrollIntoView({block:'center',behavior:'smooth'});if(m&&['reference','sepa'].includes(m.flow))pay(true)})}
function demoControls(){return '<details class="demo-controls"><summary>评审演示：切换后台返回状态</summary><button type="button" data-flow="success">成功</button><button type="button" data-flow="failed">失败／拒绝</button><button type="button" data-flow="expired">超时</button><button type="button" data-flow="pending">仍在处理</button></details>'}
function result(status){$('flowOverlay').classList.add('open');document.body.style.overflow='hidden';const messages={pending:['付款尚未确认','请在支付 App 或银行页面完成操作。我们会更新此订单的付款结果。'],success:['付款成功','此订单已完成付款。'],failed:['付款未完成','本次付款未成功。你可以返回收银台选择其他方式。'],expired:['付款请求已超时','请返回收银台重新发起付款。']};const [title,desc]=messages[status]||messages.pending;$('flowTitle').textContent=title;$('flowIntro').textContent=desc;$('flowBody').innerHTML=status==='pending'?'<div class="box">可稍后查看订单状态。关闭此页面不会取消正在处理的付款。</div>':'';$('flowActions').innerHTML=(status==='pending'?'<button class="primary" type="button" data-flow="pending">查看付款状态</button><button class="secondary" type="button" data-flow="close">返回收银台</button>':'<button class="primary" type="button" data-flow="close">'+(status==='success'?'完成':'返回收银台')+'</button>')+demoControls()}
function showFlow(title,intro,body,actions){$('flowOverlay').classList.add('open');document.body.style.overflow='hidden';$('flowTitle').textContent=title;$('flowIntro').textContent=intro;$('flowBody').innerHTML=body;$('flowActions').innerHTML=actions}
function validateInput(m){if(m.flow==='mbway'){const v=state.phone.replace(/[\s()-]/g,'');const ok=/^\+3519\d{8}$/.test(v);$('mbwayError').textContent=ok?'':'请输入以 +351 开头的葡萄牙手机号。';return ok}if(m.flow==='blik'){const ok=/^\d{6}$/.test(state.blikCode);$('blikError').textContent=ok?'':'请输入银行 App 显示的 6 位数字代码。';return ok}return true}
function pay(showInfo=false){const m=apms.find(x=>x.id===state.selected);if(!m){const name=label(state.selected);if(['wechat-cn','alipay-cn'].includes(state.selected)){if(state.device==='pc')showFlow(`${name} 扫码支付`,'请使用对应 App 扫描二维码并确认。','<div class="box"><div class="qr-demo">渠道返回的二维码展示区</div></div>','<button class="primary" type="button" data-flow="pending">查看付款状态</button>');else showFlow(`打开 ${name}`,'在 App 中确认付款后返回 Hui+。','<div class="box">若无法打开 App，请返回收银台选择其他方式。</div>','<button class="primary" type="button" data-flow="pending">演示从 App 返回</button>');return}if(['applepay','googlepay'].includes(state.selected)){showFlow(`${name} 付款确认`,'请在设备系统弹出的支付界面完成验证。','<div class="box">完成验证后，Hui+ 查询支付结果。</div>','<button class="primary" type="button" data-flow="pending">查看付款状态</button>');return}showFlow(name,'按现有支付流程操作。','<div class="box">本原型重点展示 v5 新增支付方式。</div>','<button class="primary" type="button" data-flow="close">返回收银台</button>');return}if(['reference','sepa'].includes(m.flow)&&!showInfo){result('pending');return}if(!validateInput(m)){(m.flow==='mbway'?$('mbwayPhone'):$('blikInput'))?.focus();return}const h5=state.device==='h5';const close='<button class="secondary" type="button" data-flow="close">返回收银台</button>';const review=demoControls();
 if(m.flow==='mbway'){const last=state.phone.replace(/\D/g,'').slice(-4);showFlow('请在 MB WAY App 中确认',`付款请求已发送至尾号 ${last} 的手机号。`,`<div class="box"><strong>等待 App 确认</strong><br>请打开 MB WAY App，查看付款请求并选择批准或拒绝。确认后可在此查看结果。</div><p class="flow-note">请勿重复发送同一笔付款请求。</p>`,`<button class="primary" type="button" data-flow="pending">查看付款状态</button>${close}${review}`);return}
 if(m.flow==='blik'){showFlow('请在银行 App 中确认','BLIK 代码已提交。','<div class="box"><strong>等待银行确认</strong><br>请打开银行 App，确认本次付款。代码提交成功不代表已经付款。</div>',`<button class="primary" type="button" data-flow="pending">查看付款状态</button>${close}${review}`);return}
 if(m.flow==='reference'){showFlow('Multibanco 付款信息','请使用下列信息在银行 App、网银或 ATM 完成付款。','<div class="box"><div class="field-line"><span>实体号</span><span>12345 <button type="button" data-copy="12345">复制</button></span></div><div class="field-line"><span>参考号</span><span>123 456 789 <button type="button" data-copy="123456789">复制</button></span></div><div class="field-line"><span>付款金额</span><strong>EUR 10.00</strong></div><div class="field-line"><span>有效期</span><span>以实际付款信息为准</span></div></div><p class="flow-note">付款后可能需要一段时间才能确认到账。请保留付款信息。</p>',`<button class="primary" type="button" data-flow="pending">查看付款状态</button>${close}${review}`);return}
 if(m.flow==='sepa'){showFlow('SEPA 银行转账信息','请在你的银行 App 或网银发起转账。','<div class="box"><div class="field-line"><span>收款人</span><span>示例收款人 <button type="button" data-copy="示例收款人">复制</button></span></div><div class="field-line"><span>IBAN</span><span>渠道返回后显示 <button type="button" data-copy="">复制</button></span></div><div class="field-line"><span>付款附言</span><span>渠道返回后显示 <button type="button" data-copy="">复制</button></span></div><div class="field-line"><span>付款金额</span><strong>EUR 10.00</strong></div></div><p class="flow-note">原型不提供真实收款账号。正式页面必须使用渠道返回的信息；到账前订单保持待付款。</p>',`<button class="primary" type="button" data-flow="pending">查看付款状态</button>${close}${review}`);return}
 if(m.flow==='wallet'){if(h5){showFlow(`打开 ${m.name}`,'即将离开 Hui+，在支付 App 中确认后返回。','<div class="box">如果没有自动打开 App，请尝试再次打开；仍无法打开时，选择其他支付方式。</div>',`<button class="primary" type="button" data-flow="pending">演示从 App 返回</button><button class="secondary" type="button" data-flow="fallback">无法打开 App</button>${review}`)}else{showFlow(`使用 ${m.name} 扫码`,'请打开对应钱包 App 扫描二维码并确认付款。','<div class="box"><div class="qr-demo">渠道返回的付款二维码展示区</div></div><p class="flow-note">实际二维码和有效期由渠道提供。</p>',`<button class="primary" type="button" data-flow="pending">查看付款状态</button>${close}${review}`)}return}
 const isBnpl=m.flow==='bnpl';const isPaysafe=m.flow==='paysafe';let action=isBnpl?'登录并确认付款计划':isPaysafe?'按服务商指引完成付款':'在银行或服务商页面完成付款';state.externalMethod=m.name;showFlow(`正在前往 ${m.name}`,'正在创建付款请求，请勿重复点击付款按钮。',`<div class="box">收到渠道返回的安全支付地址后，将跳转到 ${esc(m.name)} ${h5?'移动网页或 App':'网页'}。${action}。</div><p class="flow-note">跳转失败或未返回时，订单仍可通过查单或通知更新。</p>`,`<button class="primary" type="button" data-flow="external-page">演示进入第三方页面</button><button class="secondary" type="button" data-flow="external-error">演示跳转失败</button>${review}`)
}
document.addEventListener('click',e=>{if(e.target.closest('#jumpApm')){$('pcApmList').scrollIntoView({block:'start',behavior:'smooth'});return}const method=e.target.closest('[data-method]');if(method){select(method.dataset.method);return}const copy=e.target.closest('[data-copy]');if(copy){if(!copy.dataset.copy){copy.textContent='暂无可复制信息';return}navigator.clipboard?.writeText(copy.dataset.copy).then(()=>{copy.textContent='已复制'}).catch(()=>{copy.textContent='请手动复制'});return}const flow=e.target.closest('[data-flow]');if(!flow)return;const type=flow.dataset.flow;if(type==='close')closeFlow();else if(['pending','success','failed','expired'].includes(type))result(type);else if(type==='external-page')showFlow(`${state.externalMethod} 支付页面（演示）`,'你已离开 Hui+ 收银台。','<div class="box">请在第三方页面完成身份验证或付款。此处仅模拟页面边界，不连接真实渠道。</div>','<button class="primary" type="button" data-flow="external-return">演示返回 Hui+</button><button class="secondary" type="button" data-flow="external-leave">演示关闭外部页面</button>');else if(type==='external-return')showFlow('正在确认付款结果','你已返回 Hui+，正在查询此订单的最新状态。','<div class="box">返回收银台不等于付款成功。若渠道尚未给出最终结果，将继续显示处理中。</div>','<button class="primary" type="button" data-flow="pending">查看查询结果</button>'+demoControls());else if(type==='external-leave')result('pending');else if(type==='external-error')showFlow('暂时无法打开支付页面','未能取得可用的支付链接，本次未进入第三方付款页。','<div class="box">请稍后重试，或返回收银台选择其他支付方式。</div>','<button class="primary" type="button" data-flow="close">返回收银台</button>');else if(type==='fallback')showFlow('无法打开支付 App','请确认已安装对应 App。','<div class="box">如果渠道支持移动网页付款，可继续在网页完成；否则请返回收银台选择其他支付方式。</div>','<button class="primary" type="button" data-flow="pending">演示网页付款后返回</button><button class="secondary" type="button" data-flow="close">切换支付方式</button>')});
document.addEventListener('input',e=>{if(e.target.id==='mbwayPhone'){state.phone=e.target.value;$('mbwayError').textContent='';return}if(e.target.id==='blikInput'){state.blikCode=e.target.value.replace(/\D/g,'').slice(0,6);e.target.value=state.blikCode;$('blikError').textContent='';return}});
function closeFlow(){$('flowOverlay').classList.remove('open');document.body.style.overflow=''}
$('pcTab').onclick=()=>{state.device='pc';closeSelector();render()};$('h5Tab').onclick=()=>{state.device='h5';state.expanded=false;closeSelector();render()};$('expandButton').onclick=()=>{if(state.device==='h5'){openSelector()}else{state.expanded=!state.expanded;render()}};$('closeSelector').onclick=closeSelector;$('closeFlow').onclick=closeFlow;$('payButton').onclick=()=>pay();document.querySelector('[data-existing="Google Pay"]').onclick=()=>{state.selected='googlepay';render();pay()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('flowOverlay').classList.contains('open'))closeFlow();else if($('selector').classList.contains('open'))closeSelector()}});
render();
</script>
</body>
</html>
